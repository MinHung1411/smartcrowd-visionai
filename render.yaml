services:
  - type: web
    name: smartcrowd-visionai
    env: python
    buildCommand: pip install -r src/requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120 wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: YOLO_MODEL_PATH
        value: best.pt
      - key: FLASK_ENV
        value: production
      - key: USE_REMOTE_AI
        value: "true"
      - key: HF_SPACE_URL
        value: https://minhunhooo-crowd-people-counter.hf.space
