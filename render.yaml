services:
  - type: web
    name: smartcrowd-visionai
    env: python
    buildCommand: pip install -r src/requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: YOLO_MODEL_PATH
        value: best.pt
      - key: FLASK_ENV
        value: production
